<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MDSTodoApp - Kayıt Ol</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/site.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="text-center mb-4">

                <div class="app-logo">
                    ✓
                </div>

                <h2 class="mt-3">
                    MDSTodoApp
                </h2>

                <p class="text-muted">
                    Yeni hesabını oluştur.
                </p>

            </div>

            <div id="errorMessage"
                 class="alert alert-danger d-none">
            </div>

            <form id="registerForm">

                <div class="mb-3">

                    <label for="fullName"
                           class="form-label">

                        Ad Soyad

                    </label>

                    <input type="text"
                           class="form-control"
                           id="fullName"
                           placeholder="Adınız Soyadınız"
                           required>

                </div>

                <div class="mb-3">

                    <label for="email"
                           class="form-label">

                        E-posta

                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           placeholder="ornek@mail.com"
                           required>

                </div>

                <div class="mb-3">

                    <label for="password"
                           class="form-label">

                        Şifre

                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           placeholder="En az 6 karakter"
                           required>

                    <div class="password-requirements mt-2">

                        <div id="passwordLength"
                             class="requirement-item text-danger">
                            <span class="requirement-icon">✕</span>
                            En az 6 karakter
                        </div>

                        <div id="passwordUppercase"
                             class="requirement-item text-danger">
                            <span class="requirement-icon">✕</span>
                            En az 1 büyük harf
                        </div>

                        <div id="passwordLowercase"
                             class="requirement-item text-danger">
                            <span class="requirement-icon">✕</span>
                            En az 1 küçük harf
                        </div>

                        <div id="passwordDigit"
                             class="requirement-item text-danger">
                            <span class="requirement-icon">✕</span>
                            En az 1 rakam
                        </div>

                        <div id="passwordSpecial"
                             class="requirement-item text-danger">
                            <span class="requirement-icon">✕</span>
                            En az 1 özel karakter
                        </div>

                    </div>

                </div>

                <div class="mb-3">

                    <label for="passwordConfirm"
                           class="form-label">

                        Şifre Tekrar

                    </label>

                    <input type="password"
                           class="form-control"
                           id="passwordConfirm"
                           placeholder="Şifrenizi tekrar girin"
                           required>

                    <div id="passwordConfirmHint"
                         class="form-text"></div>

                </div>

                <button type="submit"
                        class="btn btn-primary w-100"
                        id="registerButton">

                    Kayıt Ol

                </button>

            </form>

            <div class="text-center mt-4">

                <span class="text-muted">
                    Zaten hesabın var mı?
                </span>

                <a href="login.html">
                    Giriş Yap
                </a>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
