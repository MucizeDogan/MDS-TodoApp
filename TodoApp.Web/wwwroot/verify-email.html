<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MDSTodoApp - Email Doğrulama</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/site.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="text-center mb-4">

                <div class="app-logo">
                    ✓
                </div>

                <h2 class="mt-3">
                    Email Doğrulama
                </h2>

                <p id="verificationDescription"
                   class="text-muted">
                    Email adresiniz doğrulanıyor...
                </p>

            </div>

            <div id="message"
                 class="alert d-none">
            </div>

            <div id="verificationActions"
                 class="text-center d-none">

                <a href="login.html"
                   class="btn btn-primary w-100">
                    Giriş Ekranına Dön
                </a>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
