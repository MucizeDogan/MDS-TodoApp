<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDSTodoApp - Email Değişikliği</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css?v=20260926">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="app-logo">✓</div>
                <h2 class="mt-3">Email Değişikliği</h2>
                <p id="description" class="text-muted">Yeni email adresiniz doğrulanıyor...</p>
            </div>
            <div id="message" class="alert d-none"></div>
            <div class="text-center">
                <a href="profile.html" class="btn btn-primary w-100">Hesabıma Dön</a>
            </div>
        </div>
    </div>
    <script src="js/config.js?v=20260928-1"></script>
    <script src="js/api.js?v=20260928-1"></script>
    <script>
        (async function () {
            const params = new URLSearchParams(location.hash.substring(1));
            const userId = params.get("userId");
            const email = params.get("email");
            const token = params.get("token");
            const message = document.getElementById("message");
            const description = document.getElementById("description");
            try {
                if (!userId || !email || !token) throw new Error("Email değişikliği bağlantısı eksik veya geçersiz.");
                await api.post("/User/ConfirmEmailChange", { userId, newEmail: email, token });
                description.textContent = "Email adresiniz başarıyla değiştirildi.";
                message.textContent = "Yeni email adresiniz artık hesabınızda kullanılabilir. Güvenlik nedeniyle tekrar giriş yapmanız gerekebilir.";
                message.className = "alert alert-success";
                localStorage.removeItem("token");
            } catch (error) {
                description.textContent = "Email değişikliği tamamlanamadı.";
                message.textContent = error.message || "Bağlantı geçersiz veya süresi dolmuş olabilir.";
                message.className = "alert alert-danger";
            }
        })();
    </script>
</body>
</html>
